# CI: 合成フィクスチャのテストスイートを実行する。
# 実データ(.ifc)を使う統合テストはリポジトリにデータが無いため自動でskipされる
# (tests/conftest.py のskip設計。ローカルの実データ環境ではフルに走る)。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Windowsのみ。ubuntu-latestは初回運用でifcopenshell(manylinux)の幾何経路が
    # segfaultすることを確認した(2026-08-02、テスト1件失敗+SIGSEGV)。本プロジェクト
    # の公式サポートはWindowsのみ(README)のため、Linux CIは原因解明までは張らない。
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>IFC Occam Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js"
      }
    }
  </script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="layout">
    <div id="sidebar">
      <div id="sidebar-scroll">
        <h1>IFC Occam Viewer</h1>
        <button id="file-pick-button" type="button">ファイル指定</button>
        <div id="selected-path">(未選択)</div>

        <button id="manual-path-toggle" type="button" aria-expanded="false">パスを直接入力</button>
        <div id="manual-path-row" style="display:none;">
          <input id="path-input" type="text" placeholder="small.ifc" />
        </div>

        <button id="load-button">読込</button>
        <div id="status-line"></div>
        <div id="load-estimate" style="display:none;"></div>

        <div id="diagnostics-summary"></div>

        <div id="list-tabs" role="tablist" aria-label="対象の一覧">
          <button type="button" id="tab-class" data-tab="class" class="active-tab" role="tab" aria-selected="true" aria-controls="panel-class" disabled>クラス 0</button>
          <button type="button" id="tab-layer" data-tab="layer" role="tab" aria-selected="false" aria-controls="panel-layer" disabled>レイヤー 0</button>
          <button type="button" id="tab-duplicate" data-tab="duplicate" role="tab" aria-selected="false" aria-controls="panel-duplicate" disabled>重複形状 0</button>
        </div>
        <div id="list-hint">行クリックで選択 / Shift+クリックで追加 / Ctrl+クリックで除外</div>
        <div id="list-panels">
          <div id="panel-class" class="list-panel active-panel">
            <div id="class-table-wrap"></div>
          </div>
          <div id="panel-layer" class="list-panel">
            <div id="layer-list"></div>
            <div id="layerless-note" style="display:none;"></div>
          </div>
          <div id="panel-duplicate" class="list-panel">
            <div id="duplicates-list"></div>
            <div id="duplicates-note" style="display:none;"></div>
          </div>
        </div>

        <div id="selection-notice"></div>
      </div>

      <div id="ops-dock">
        <div id="selection-chip">
          <span id="selection-chip-label" class="selection-chip-empty">選択なし</span>
          <button id="selection-chip-clear-button" type="button" title="選択を全解除" style="display:none;">×</button>
          <span id="selection-chip-outline-note" style="display:none;"></span>
        </div>

        <h2 id="info-title" style="display:none;">選択情報</h2>
        <div id="info-panel"></div>

        <h2 id="ops-controls-title" style="display:none;">操作</h2>
        <div id="ops-controls" style="display:none;">
          <button id="op-delete-button">削除</button>
          <div id="op-simplify-row">
            <select id="op-simplify-method">
              <option value="bbox">bbox</option>
              <option value="convex_hull">凸包</option>
              <option value="decimate">間引き</option>
            </select>
            <input
              id="op-simplify-ratio"
              type="number"
              min="0.05"
              max="0.95"
              step="0.05"
              value="0.3"
              style="display:none;"
            />
            <button id="op-simplify-button">軽量化</button>
          </div>
          <div id="simplify-desc"></div>
          <div id="simplify-ratio-desc" style="display:none;">0.05〜0.95 の範囲で指定します。</div>
          <div id="simplify-estimate"></div>
          <button id="op-keep-button">残す</button>
        </div>

        <h2 id="ops-panel-title" style="display:none;">操作リスト</h2>
        <ul id="ops-panel-list" style="display:none;"></ul>
        <button id="ops-clear-button" style="display:none;">全クリア</button>

        <details id="preset-section">
          <summary id="preset-title">操作パターン</summary>
          <div id="preset-desc">クラスやレイヤーへの操作をまとめて保存し、別のモデルでも呼び出せます。</div>
          <ul id="preset-list"></ul>
          <div id="preset-empty-notice" style="display:none;">操作パターンがまだありません。</div>
          <button id="preset-load-samples-button" type="button">サンプルを追加</button>
          <button id="preset-save-button" type="button">現在の操作から保存</button>
        </details>

        <h2>出力</h2>
        <button id="export-path-pick-button" type="button">保存先を指定</button>
        <div id="export-selected-path">(未選択)</div>

        <button id="export-manual-path-toggle" type="button" aria-expanded="false">パスを直接入力</button>
        <div id="export-manual-path-row" style="display:none;">
          <input id="export-path-input" type="text" value="output.ifc" />
        </div>
        <div id="export-path-error" class="rule-error" style="display:none;"></div>

        <label id="export-consolidate-label" style="display:block; font-size:12px; margin-bottom:6px;">
          <input id="export-consolidate-checkbox" type="checkbox" />
          重複形状を共有化して出力(フラット化されたモデル向け)
        </label>
        <label id="export-inline-cleanup-label" style="display:block; font-size:12px; margin-bottom:6px;" title="一時ファイルと追加メモリを使わない代わりに、大きなモデルでは遅くなることがあります。メモリが足りずに出力が失敗するときに試してください。出力内容はどちらの方式でも同じです。">
          <input id="export-inline-cleanup-checkbox" type="checkbox" />
          省メモリ方式で書き出す(逐次ゴミ回収)
        </label>
        <button id="export-button">出力</button>
        <div id="export-status-line"></div>
        <div id="export-result"></div>
      </div>
    </div>
    <div id="sidebar-resizer" title="ドラッグでサイドバー幅を変更"></div>
    <div id="viewport">
      <button id="sidebar-toggle" type="button" title="サイドバーの表示切替">«</button>
      <div id="error-banner"></div>
      <label id="color-mode-label" for="color-mode-select">配色</label>
      <select id="color-mode-select" title="モデルの色の決め方">
        <option value="ifc">IFCの色</option>
        <option value="class">クラス別</option>
      </select>
      <button id="stage-toggle-button" type="button" title="床とグリッドの表示切替" aria-pressed="true">ステージ</button>
      <canvas id="canvas"></canvas>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
